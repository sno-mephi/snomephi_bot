version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis_meeting_sno
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./docker_volumes/redis_data:/data
    networks:
      - backend

  postgres:
    image: postgres:latest
    container_name: snomephi_meeting_postgres
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./docker_volumes/postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - backend

  java_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java_app_container
    ports:
      - "5004:5004"
    volumes:
      - ./logs:/usr/src/app/logs
    networks:
      - backend
    depends_on:
      - postgres
      - redis

networks:
  backend:
